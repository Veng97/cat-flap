<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cat Flap Concept</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f3eb;
			--ink: #263633;
			--muted: #71807a;
			--line: #c7ccc3;
			--frame: #354943;
			--accent: #c36b3f;
			font-family: "Segoe UI", sans-serif;
			color: var(--ink);
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; background: var(--paper); }
		header {
			position: sticky;
			top: 0;
			z-index: 1;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 12px 18px;
			min-height: 62px;
			padding: 8px 16px;
			border-bottom: 1px solid var(--line);
			background: var(--paper);
		}
		.brand { font-size: 13px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
		.mode-control { display: inline-flex; border: 1px solid var(--line); }
		.mode-control button {
			min-height: 34px;
			padding: 6px 12px;
			border: 0;
			background: transparent;
			color: var(--ink);
			font: inherit;
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
		}
		.mode-control button + button { border-left: 1px solid var(--line); }
		.mode-control button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
		.mode-control button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		main { width: min(100%, 1600px); margin-inline: auto; }
		.layer-controls { display: none; position: sticky; bottom: 0; z-index: 2; order: 2; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--paper); }
		.layer-controls.visible { display: grid; }
		.layer-row { display: grid; grid-template-columns: 1fr; gap: 8px; min-width: 0; padding: 10px 12px; border: 1px solid var(--frame); border-top-width: 3px; border-radius: 4px; background: #e7ebe6; }
		.layer-name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
		.layer-name input { accent-color: var(--frame); }
		.opacity-control { display: grid; grid-template-columns: minmax(54px, 1fr) 36px; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; }
		.opacity-control input { width: 100%; accent-color: var(--frame); }
		.opacity-control output { font-variant-numeric: tabular-nums; text-align: right; }
		.viewer { width: min(100%, 1600px); margin-inline: auto; aspect-ratio: 4 / 9; }
		.viewer.folded { display: flex; flex: 1; min-height: 0; flex-direction: column; aspect-ratio: auto; }
		.viewer iframe { display: block; width: 100%; height: 100%; border: 0; }
		.viewer.folded iframe { flex: 1; min-height: 0; height: auto; }
		body.folded { display: flex; min-height: 100vh; flex-direction: column; }
		body.folded main { display: flex; min-height: 0; flex: 1; flex-direction: column; }
		@media (max-width: 760px) {
			.layer-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
		}
		@media (max-width: 480px) {
			header { padding-inline: 12px; }
			.brand { font-size: 11px; }
			.mode-control button { padding-inline: 9px; }
		}
	</style>
</head>
<body class="folded">
	<header>
		<div class="brand">CAT FLAP CONCEPT</div>
		<div class="mode-control" role="group" aria-label="Sheet layout">
			<button type="button" data-mode="folded" aria-pressed="true">Fold</button>
			<button type="button" data-mode="unfolded" aria-pressed="false">Unfold</button>
		</div>
	</header>
	<main>
		<section class="layer-controls visible" aria-label="Layer visibility and opacity">
			<div class="layer-row">
				<label class="layer-name"><input type="checkbox" checked> Geometry</label>
				<label class="opacity-control"><input type="range" aria-label="Geometry opacity" min="0" max="100" value="100"><output>100%</output></label>
			</div>
			<div class="layer-row">
				<label class="layer-name"><input type="checkbox" checked> Actuators</label>
				<label class="opacity-control"><input type="range" aria-label="Actuators opacity" min="0" max="100" value="0"><output>0%</output></label>
			</div>
			<div class="layer-row">
				<label class="layer-name"><input type="checkbox" checked> PCB</label>
				<label class="opacity-control"><input type="range" aria-label="PCB opacity" min="0" max="100" value="0"><output>0%</output></label>
			</div>
			<div class="layer-row">
				<label class="layer-name"><input type="checkbox" checked> Sensors</label>
				<label class="opacity-control"><input type="range" aria-label="Sensors opacity" min="0" max="100" value="0"><output>0%</output></label>
			</div>
		</section>
		<div class="viewer folded" id="viewer">
			<iframe id="drawing" src="./solenoid_concept.svg" title="Interactive cat flap concept sheets"></iframe>
		</div>
	</main>
	<script>
		const channel = "cat-flap-viewer";
		const drawing = document.querySelector("#drawing");
		const viewer = document.querySelector("#viewer");
		const layerControls = document.querySelector(".layer-controls");
		const modeButtons = [...document.querySelectorAll("[data-mode]")];
		const rows = [...document.querySelectorAll(".layer-row")];
		const queuedMessages = [];
		let ready = false;
		let folded = false;

		function send(action, details = {}) {
			const message = { channel, action, ...details };
			if (!ready) queuedMessages.push(message);
			else drawing.contentWindow.postMessage(message, "*");
		}

		function updateControls(state) {
			folded = state.folded;
			document.body.classList.toggle("folded", folded);
			viewer.classList.toggle("folded", folded);
			layerControls.classList.toggle("visible", folded);
			modeButtons.forEach(button => {
				button.setAttribute("aria-pressed", String((button.dataset.mode === "folded") === folded));
			});
			rows.forEach((row, index) => {
				const layer = state.layers[index];
				const checkbox = row.querySelector('input[type="checkbox"]');
				const slider = row.querySelector('input[type="range"]');
				const output = row.querySelector("output");
				checkbox.checked = layer.visible;
				checkbox.disabled = layer.visible && state.layers.filter(item => item.visible).length === 1;
				slider.disabled = !layer.visible;
				slider.value = String(layer.opacity);
				output.value = `${slider.value}%`;
			});
		}

		window.addEventListener("message", event => {
			if (event.source !== drawing.contentWindow || !event.data || event.data.channel !== channel) return;
			if (!Array.isArray(event.data.layers)) return;
			ready = true;
			updateControls(event.data);
			while (queuedMessages.length) drawing.contentWindow.postMessage(queuedMessages.shift(), "*");
		});

		drawing.addEventListener("load", () => send("sync"));

		modeButtons.forEach(button => button.addEventListener("click", () => {
			send("fold", { value: button.dataset.mode === "folded" });
		}));

		rows.forEach((row, index) => {
			const checkbox = row.querySelector('input[type="checkbox"]');
			const slider = row.querySelector('input[type="range"]');
			const output = row.querySelector("output");
			checkbox.addEventListener("change", () => {
				send("layer", { index, value: { visible: checkbox.checked } });
			});
			slider.addEventListener("input", () => {
				output.value = `${slider.value}%`;
				send("layer", { index, value: { opacity: Number(slider.value) } });
			});
		});

		window.addEventListener("wheel", event => {
			if (!folded) return;
			event.preventDefault();
			send("scroll", { deltaY: event.deltaY });
		}, { passive: false });
	</script>
</body>
</html>
